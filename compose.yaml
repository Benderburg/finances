services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: local-norocel-only
      MYSQL_DATABASE: norocel
    ports:
      - "127.0.0.1:33067:3306"
    volumes:
      - norocel_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-plocal-norocel-only"]
      interval: 5s
      timeout: 3s
      retries: 30
  php:
    profiles: [web]
    build: ./backend
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://127.0.0.1:8085
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: norocel
      SESSION_SECURE_COOKIE: "false"
      SANCTUM_STATEFUL_DOMAINS: 127.0.0.1:8085
      MAIL_MAILER: log
    volumes:
      - ./backend:/var/www/html:ro
      - ./backend/storage:/var/www/html/storage
      - ./backend/bootstrap/cache:/var/www/html/bootstrap/cache
    command: [sh, -c, "chown -R www-data:www-data storage bootstrap/cache && exec php-fpm"]
  web:
    profiles: [web]
    image: nginx:alpine
    depends_on: [php]
    ports: ["127.0.0.1:8085:80"]
    volumes:
      - ./backend/public:/var/www/html/public:ro
      - ./scripts/nginx.conf:/etc/nginx/conf.d/default.conf:ro
volumes:
  norocel_mysql:
