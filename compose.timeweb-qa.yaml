services:
  mysql-timeweb:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: local-norocel-only
      MYSQL_DATABASE: norocel
    tmpfs: [/var/lib/mysql]
    healthcheck:
      test: [CMD, mysqladmin, ping, -h, localhost, -plocal-norocel-only]
      interval: 5s
      timeout: 3s
      retries: 30
  php-timeweb:
    build: ./backend
    depends_on:
      mysql-timeweb:
        condition: service_healthy
    environment:
      APP_ENV: local
      APP_DEBUG: "false"
      APP_URL: http://127.0.0.1:8001
      DB_HOST: mysql-timeweb
      DB_PORT: 3306
      DB_DATABASE: norocel
      DB_USERNAME: root
      DB_PASSWORD: local-norocel-only
      SESSION_SECURE_COOKIE: "false"
      SANCTUM_STATEFUL_DOMAINS: 127.0.0.1:8001
      MAIL_MAILER: log
    networks:
      default:
        aliases: [php]
    volumes:
      - ./backend:/var/www/html:ro
      - vendor-timeweb:/var/www/html/vendor
      - ./.runtime/timeweb-qa-vendor.zip:/tmp/vendor.zip:ro
      - ./backend/storage:/var/www/html/storage
      - ./backend/bootstrap/cache:/var/www/html/bootstrap/cache
    command: [sh, -c, "unzip -oq /tmp/vendor.zip -d vendor && mkdir -p storage/framework/testing && chown -R www-data:www-data storage bootstrap/cache && touch /tmp/norocel-qa-ready && exec php-fpm"]
    healthcheck:
      test: [CMD, test, -f, /tmp/norocel-qa-ready]
      interval: 2s
      timeout: 2s
      retries: 60
  web-timeweb:
    image: nginx:alpine
    depends_on:
      php-timeweb:
        condition: service_healthy
    ports: ["127.0.0.1:8001:80"]
    volumes:
      - ./backend/public:/var/www/html/public:ro
      - ./scripts/nginx.conf:/etc/nginx/conf.d/default.conf:ro
volumes:
  vendor-timeweb:
